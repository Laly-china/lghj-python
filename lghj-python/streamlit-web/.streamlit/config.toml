# 同花顺风格主题（白色背景版）—— 参考 THS PC 行情终端浅色模式：白底 + 红色主色调 + 涨红跌绿

[theme]
base = "light"
primaryColor = "#E64545"             # 同花顺红（主按钮/链接/选中态）
backgroundColor = "#FFFFFF"          # 页面白底
secondaryBackgroundColor = "#F5F6F8" # 卡片/控件底（浅灰）
codeBackgroundColor = "#F5F6F8"
textColor = "#1F2329"
linkColor = "#E64545"
borderColor = "#E2E6EB"
codeTextColor = "#57606A"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"

font = "sans-serif"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# 语义色（中国证券习惯：红涨绿跌，代码中按此语义使用）
redColor = "#E64545"        # 涨
greenColor = "#00A876"      # 跌
yellowColor = "#D99E00"     # 均价线/警示
orangeColor = "#E8862C"
blueColor = "#1F7AE0"
violetColor = "#8E5CE6"
grayColor = "#6B7480"

chartCategoricalColors = [
    "#E64545",
    "#00A876",
    "#D99E00",
    "#1F7AE0",
    "#8E5CE6",
    "#E8862C",
    "#6B7480",
    "#2FA36B",
]

dataframeBorderColor = "#E2E6EB"
dataframeHeaderBackgroundColor = "#F5F6F8"

[theme.sidebar]
backgroundColor = "#F8F9FB"
secondaryBackgroundColor = "#EFF1F4"
codeBackgroundColor = "#EFF1F4"
textColor = "#1F2329"
borderColor = "#E2E6EB"
primaryColor = "#E64545"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
